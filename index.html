<!DOCTYPE html>
<html>
<head>
    <title>Purple Task Planner</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #1a052b;
            --text-color: #f0e6ff;
            --accent-color: #8a2be2;
            --secondary-bg: #2d0a4d;
            --button-color: #9b4dff;
            --button-hover: #7b2cff;
            --delete-color: #ff4d6d;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--accent-color);
        }
        
        h1 {
            color: var(--text-color);
            margin: 0;
            font-size: 24px;
        }
        
        .user-info {
            font-size: 14px;
            color: var(--accent-color);
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        #taskInput {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            background: var(--secondary-bg);
            color: var(--text-color);
            font-size: 16px;
        }
        
        #taskInput::placeholder {
            color: #a78bfa;
        }
        
        button {
            padding: 12px 20px;
            background: var(--button-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: var(--button-hover);
        }
        
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        li {
            background: var(--secondary-bg);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .task-text {
            flex: 1;
            word-break: break-word;
        }
        
        .delete-btn {
            background: var(--delete-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            margin-left: 10px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        .delete-btn:hover {
            opacity: 0.8;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: #a78bfa;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Purple Planner</h1>
            <div class="user-info" id="userInfo">Loading...</div>
        </header>
        
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Add new task...">
            <button onclick="addTask()">Add</button>
        </div>
        
        <ul id="taskList">
            <div class="empty-state">No tasks yet. Add your first task!</div>
        </ul>
    </div>

    <script>
        // Initialize Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();
        
        // User data from Telegram
        const user = tg.initDataUnsafe.user;
        let username = 'Guest';
        
        if (user) {
            username = user.username || `${user.first_name}${user.last_name ? ' ' + user.last_name : ''}`;
        }
        
        document.getElementById('userInfo').textContent = `@${username}`;
        
        // Load tasks from localStorage (user-specific)
        function loadTasks() {
            const userTasks = localStorage.getItem(`tasks_${username}`);
            if (userTasks) {
                return JSON.parse(userTasks);
            }
            return [];
        }
        
        // Save tasks to localStorage
        function saveTasks(tasks) {
            localStorage.setItem(`tasks_${username}`, JSON.stringify(tasks));
        }
        
        let tasks = loadTasks();
        
        // Render tasks
        function renderTasks() {
            const taskList = document.getElementById('taskList');
            taskList.innerHTML = '';
            
            if (tasks.length === 0) {
                taskList.innerHTML = '<div class="empty-state">No tasks yet. Add your first task!</div>';
                return;
            }
            
            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <div class="task-text">${task}</div>
                    <button class="delete-btn" onclick="deleteTask(${index})">Delete</button>
                `;
                taskList.appendChild(li);
            });
        }
        
        // Add new task
        function addTask() {
            const taskInput = document.getElementById('taskInput');
            const taskText = taskInput.value.trim();
            
            if (taskText) {
                tasks.push(taskText);
                saveTasks(tasks);
                taskInput.value = '';
                renderTasks();
                
                // Close keyboard on mobile
                taskInput.blur();
            }
        }
        
        // Delete task
        function deleteTask(index) {
            tasks.splice(index, 1);
            saveTasks(tasks);
            renderTasks();
        }
        
        // Handle Enter key
        document.getElementById('taskInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });
        
        // Initial render
        renderTasks();
        
        // Send data back to bot when needed
        function sendDataToBot() {
            tg.sendData(JSON.stringify({
                action: 'tasks_updated',
                username: username,
                taskCount: tasks.length
            }));
        }
    </script>
</body>
</html>
